<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="%BASE_URL%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="theme-color" content="#09090b" />
        <link rel="apple-touch-icon" href="%BASE_URL%/apple-icon-144x144.webp" />
        <meta name="author" content="GhuniNew" />
        <link rel="manifest" href="%BASE_URL%/manifest.json" />
        <meta name="description" content="portfolio of GhuniNew" />
        <title>portfolio</title>
    </head>
    <body>
        <div id="root"></div>
        <script>
            (() => {
                let storedTheme = null;

                try {
                    storedTheme = localStorage.getItem("theme");
                } catch {
                    // Ignore localStorage errors
                }

                const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

                const theme = ["light", "dark", "system"].includes(storedTheme) ? storedTheme : "dark";

                document.documentElement.classList.toggle(
                    "dark",
                    theme === "dark" || (theme === "system" && systemTheme === "dark"),
                );
            })();
        </script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
